<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portal de agendamentos e gerenciamento da Clínica Mais Saúde. Agende consultas, exames e vacinas online." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Clínica Mais Saúde — Portal de Agendamentos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- VLibras — tradutor de texto para Libras (widget oficial do Governo Federal / gov.br).
         Acessibilidade para pessoas surdas: o avatar traduz o conteúdo da página selecionado. -->
    <div vw class="enabled" aria-hidden="true">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      // Inicializa o widget quando o plugin carrega (falha silenciosa se o serviço estiver indisponível).
      window.addEventListener('load', function () {
        try { new window.VLibras.Widget('https://vlibras.gov.br/app'); } catch (e) { /* VLibras indisponível */ }
      });
    </script>
  </body>
</html>
